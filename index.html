<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE TREELINE</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Menlo,Consolas,monospace;color:#e8e1cc}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#start{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#start .box{text-align:center;max-width:560px;padding:20px}
#start h1{font-size:44px;letter-spacing:14px;margin:0 0 10px 14px;font-weight:normal}
#start .sub{opacity:.55;font-size:13px;letter-spacing:2px;margin:0 0 28px 0}
#start .hint{opacity:.45;font-size:12px;line-height:1.7;margin-top:26px}
button{font:inherit;font-size:18px;letter-spacing:4px;background:#000;color:#e8e1cc;border:1px solid #e8e1cc;padding:14px 26px;margin:6px;cursor:pointer}
button:hover{background:#e8e1cc;color:#000}
#fps{position:fixed;right:10px;top:10px;font-size:12px;background:rgba(0,0,0,.7);padding:4px 8px;display:none}
#lock{position:fixed;left:0;right:0;bottom:24px;text-align:center;font-size:12px;opacity:.5;display:none;letter-spacing:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><div class="box">
  <h1>THE TREELINE</h1>
  <p class="sub">ATMOSPHERE TEST &middot; STAGE 1 OF 4 &middot; NO SOUND YET</p>
  <button id="go">WALK IN</button>
  <button id="vr" style="display:none">ENTER VR</button>
  <p class="hint">desktop: click to look &middot; WASD walk &middot; F fps &middot; hold Shift = debug fast-walk<br>
  Oculus Go: hold trigger or touchpad to walk where you look &middot; double-tap = fps</p>
</div></div>
<div id="fps">-- fps</div>
<div id="lock">CLICK TO LOOK AROUND</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function () {
'use strict';
var T = THREE;

/* ============================================================
   THE TREELINE  -  stage 1: forest + 1-bit night look + walking

   Every number you might want to tune lives in CONFIG.
   Later stages add CONFIG.sound, CONFIG.follower, CONFIG.watcher,
   CONFIG.director here too, so there's one place to tweak the fear.
   ============================================================ */
var CONFIG = {
  world: {
    tile: 80,            // metres. The whole forest is ONE 80x80m tile repeated forever. This IS the loop.
    drawRadius: 22,      // only stuff within this many metres gets drawn (the fog is solid black by 20)
    smallRadius: 15,     // ferns and twigs are tiny, so they get culled sooner
    groundStep: 0.5,     // ground mesh vertex spacing (smaller = smoother path edges, more triangles)
    groundSnap: 2,       // the ground mesh re-centres on you every N metres
    repackStep: 1        // the instance lists get rebuilt after you walk this far
  },
  look: {
    ink: '#1c1a2b',      // same ink + paper as STYLE LAB's 1-bit style
    paper: '#e8e1cc',
    outline: 0.03,       // inverted-hull outline thickness in metres
    fogNear: 3,          // fog starts here...
    fogFar: 20,          // ...and is pure ink by here
    skyTop: '#4d4d4d',   // faint overcast glow straight up (only shows through gaps in the canopy)
    skyCurve: 6,         // how tightly that glow hugs the top of the sky (STYLE LAB used 0.6 = glow everywhere)
    desktopPixelH: 300,  // desktop renders this many pixels tall, then gets blown up with sharp pixels
    desktopFov: 70,
    vrFoveation: 1,      // 0..1 fixed foveated rendering in VR (renders the blurry lens edges cheaper)
    antialias: true
  },
  moon: {
    intensity: 0.25,     // cold moonlight from above. Barely there on purpose.
    hemi: 0.06,          // tiny bit of sky fill so nothing is mathematically zero
    dir: [0.45, 1, 0.25] // where the moon is (direction it shines FROM)
  },
  flashlight: {
    intensity: 1.8,
    range: 22,           // light fades linearly to nothing at this distance
    angle: 0.36,         // half-angle of the cone in radians (~20 degrees, narrow)
    penumbra: 0.55,      // soft edge of the cone, 0 = razor edge
    offset: [0.12, -0.28, 0], // held a bit right and below your eyes
    flickerMinGap: 25,   // seconds between random flickers
    flickerMaxGap: 75,
    flickerDepth: 0.55   // how dark a random flicker can dip (0..1). The scare director can go harder later.
  },
  walk: {
    speed: 1.2,          // m/s. Slow is scary.
    accel: 2.5,          // how fast you ease in/out of walking
    eyeHeight: 1.6,
    stride: 0.72,        // metres per footstep (stage 2 hangs footstep sounds on this)
    playerRadius: 0.35,  // how close you can get to a trunk
    mouseSens: 0.0022,
    desktopRunMultiplier: 4  // hold Shift on desktop to zoom around while testing. Not in VR.
  },
  forest: {
    seed: 7,             // change this for a totally different forest
    treeCell: 2.5,       // one tree per 2.5x2.5m cell (roughly). Must divide the tile evenly.
    treeChance: 0.85,
    clusterChance: 0.35, // dense patches get a second tree in the cell
    birch: 0.22,         // fraction of trees that are pale birches
    dead: 0.13,          // fraction that are dead, branchless, broken-off snags
    leanChance: 0.1,     // fraction that lean hard
    stumps: 70, rocks: 90, bushes: 220, ferns: 900, logs: 45, sticks: 1300,
    fernSway: 0.18,
    branchStubs: true,   // dead branch stubs on pines (+1 draw call). Turn off if the Go struggles.
    canopy: true         // dark canopy silhouettes way up top (+1 draw call)
  },
  path: {
    width: 0.55,         // half-width of the dirt path in metres
    widthVar: 0.25,      // it pinches and widens
    clearance: 0.75,     // how far trees keep back from the path edge
    wander: [6, 3, 1.5], // how much it winds (three layered curves)
    fade: 0.7            // how faint it gets in the "where did the path go" stretches
  },
  debug: { showFps: true }
};

// ---------- tiny seeded random so the forest is the same every load (from STYLE LAB)
var seed = 1337;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function rr(a, b) { return a + (b - a) * rnd(); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
// runtime randomness uses Math.random instead, so scares are never the same twice
function mr(a, b) { return a + (b - a) * Math.random(); }
function smoothstep(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function mod(a, n) { return ((a % n) + n) % n; }

/* ============================================================
   STYLE LAB CODE (copied): uniforms, Bayer dither, patch(), hulls
   ============================================================ */

// ---------- uniforms shared by every patched shader (same object refs)
var U = {
  uTime: { value: 0 },
  uSnapRes: { value: new T.Vector2(320, 240) },
  uLevels: { value: 24 },
  uInk: { value: new T.Color(CONFIG.look.ink) },
  uPaper: { value: new T.Color(CONFIG.look.paper) },
  uOutline: { value: CONFIG.look.outline }
};

// Ordered (Bayer) dither threshold, 0..1. mod() keeps it precise on big screens.
var BAYER = [
  'float bay2(vec2 a){ a = mod(floor(a), 2.0); return fract(a.x*0.5 + a.y*a.y*0.75); }',
  'float bay4(vec2 a){ return bay2(0.5*a)*0.25 + bay2(a); }',
  'float bay8(vec2 a){ return bay4(0.5*a)*0.25 + bay2(a); }',
  ''
].join('\n');

/* ---------- the shader hacks ----------
   snap   : PS1 vertex wobble. Rounds each vertex to a low-res pixel grid.
   affine : PS1 texture warp. Undoes perspective-correct texture mapping.
   dither : 1 = colour crunch with ordered dither, 2 = pure 1-bit (two colours).
   door   : "screen-door" transparency (holes in a pattern instead of blending).
   sway   : wind wobble for grass / leaves, scaled by height.
   radialFog (NEW for THE TREELINE): fog by true distance instead of screen depth,
            so a tree doesn't get clearer just because you turned your head. */
function patch(m, o) {
  var key = JSON.stringify(o);
  m.customProgramCacheKey = function () { return key; };
  m.onBeforeCompile = function (sh) {
    sh.uniforms.uTime = U.uTime; sh.uniforms.uSnapRes = U.uSnapRes;
    sh.uniforms.uLevels = U.uLevels; sh.uniforms.uInk = U.uInk; sh.uniforms.uPaper = U.uPaper;
    var vs = sh.vertexShader, fs = sh.fragmentShader;
    vs = 'uniform float uTime;\nuniform vec2 uSnapRes;\n' + (o.affine ? 'varying float vAffW;\n' : '') + vs;
    fs = 'uniform float uLevels;\nuniform vec3 uInk;\nuniform vec3 uPaper;\n' + (o.affine ? 'varying float vAffW;\n' : '') + BAYER + fs;
    if (o.sway) {
      vs = vs.replace('#include <begin_vertex>',
        '#include <begin_vertex>\n' +
        '#ifdef USE_INSTANCING\n vec2 swp = vec2(instanceMatrix[3].x, instanceMatrix[3].z);\n#else\n vec2 swp = vec2(0.0);\n#endif\n' +
        'float sw = sin(uTime*1.7 + swp.x*0.35 + swp.y*0.25) + 0.4*sin(uTime*3.3 + swp.x*0.9);\n' +
        'transformed.x += sw * max(position.y, 0.0) * ' + o.sway.toFixed(3) + ';\n' +
        'transformed.z += sw * 0.5 * max(position.y, 0.0) * ' + o.sway.toFixed(3) + ';\n');
    }
    var pv = '#include <project_vertex>\n';
    if (o.snap) pv += '{ vec2 sn = uSnapRes * 0.5; gl_Position.xy = floor(gl_Position.xy / gl_Position.w * sn + 0.5) / sn * gl_Position.w; }\n';
    if (o.affine) pv += '#ifdef USE_UV\n vUv *= gl_Position.w;\n#endif\n vAffW = gl_Position.w;\n';
    vs = vs.replace('#include <project_vertex>', pv);
    if (o.radialFog) vs = vs.replace('#include <fog_vertex>', '#ifdef USE_FOG\n vFogDepth = length(mvPosition.xyz);\n#endif\n');
    if (o.affine) fs = fs.replace('#include <map_fragment>', '#ifdef USE_MAP\n diffuseColor *= texture2D(map, vUv / vAffW);\n#endif\n');
    var df = '#include <dithering_fragment>\n';
    if (o.door) df += 'if (bay4(gl_FragCoord.xy) > ' + o.door.toFixed(3) + ') discard;\n';
    if (o.dither === 1) df += '{ float bt = bay4(gl_FragCoord.xy); gl_FragColor.rgb = clamp(floor(gl_FragColor.rgb * uLevels + bt) / uLevels, 0.0, 1.0); }\n';
    if (o.dither === 2) df += '{ float l = dot(gl_FragColor.rgb, vec3(0.299, 0.587, 0.114)); l = clamp((l - 0.5) * 1.25 + 0.5, 0.0, 1.0); gl_FragColor.rgb = mix(uInk, uPaper, step(bay8(gl_FragCoord.xy) + 0.001, l)); }\n';
    fs = fs.replace('#include <dithering_fragment>', df);
    sh.vertexShader = vs; sh.fragmentShader = fs;
  };
  return m;
}

// Outlines: the "inverted hull" trick. A copy of the mesh, pushed outward
// along its normals, drawn inside-out in solid ink. Cheap and works in VR.
function makeHullMat(color) {
  var m = new T.MeshBasicMaterial({ color: new T.Color(color), side: T.BackSide });
  m.onBeforeCompile = function (sh) {
    sh.uniforms.uOutline = U.uOutline;
    sh.vertexShader = 'uniform float uOutline;\nattribute vec3 hullNormal;\n' +
      sh.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + hullNormal * uOutline;');
  };
  m.customProgramCacheKey = function () { return 'hull'; };
  return m;
}
// Hard-edged boxes have split normals, which would crack the outline at corners.
// Average normals of vertices in the same spot so the hull stays closed.
function addHullNormals(g) {
  if (g.attributes.hullNormal) return;
  var p = g.attributes.position, n = g.attributes.normal, acc = {}, i, k;
  var out = new Float32Array(p.count * 3);
  function key(i) { return Math.round(p.getX(i) * 1000) + ',' + Math.round(p.getY(i) * 1000) + ',' + Math.round(p.getZ(i) * 1000); }
  for (i = 0; i < p.count; i++) {
    k = key(i); if (!acc[k]) acc[k] = [0, 0, 0];
    acc[k][0] += n.getX(i); acc[k][1] += n.getY(i); acc[k][2] += n.getZ(i);
  }
  for (i = 0; i < p.count; i++) {
    var a = acc[key(i)], l = Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]) || 1;
    out[i * 3] = a[0] / l; out[i * 3 + 1] = a[1] / l; out[i * 3 + 2] = a[2] / l;
  }
  g.setAttribute('hullNormal', new T.BufferAttribute(out, 3));
}

// The hull material. One change from STYLE LAB: fog off. The night fog is black, but
// the outline is ink, and ink must stay ink or distant trunks get a darker "halo".
var hullMat = makeHullMat(CONFIG.look.ink);
hullMat.fog = false;

/* ============================================================
   THE WORLD MATHS
   Everything here repeats every W metres in x and z, so the forest
   tiles perfectly. That's the trick behind "endless": it's one tile,
   and we always draw the copy of each thing that's nearest to you.
   ============================================================ */
var W = CONFIG.world.tile, TAU = Math.PI * 2, K = TAU / W;
var P = CONFIG.path, F = CONFIG.forest;

// shortest signed distance on a looping world (e.g. 79m apart is really 1m apart)
function wrapD(d) { return d - W * Math.round(d / W); }

// The path runs roughly along z, wiggling in x. Sine waves with a WHOLE number of
// wiggles per tile, so the end of the tile lines up exactly with the start.
function pathX(z) { var a = P.wander; return 40 + a[0] * Math.sin(K * z + 0.4) + a[1] * Math.sin(2 * K * z + 2.1) + a[2] * Math.sin(3 * K * z + 4.4); }
function pathSlope(z) { var a = P.wander; return K * (a[0] * Math.cos(K * z + 0.4) + 2 * a[1] * Math.cos(2 * K * z + 2.1) + 3 * a[2] * Math.cos(3 * K * z + 4.4)); }
var _pa = { d: 0, w: 0, vis: 1, mask: 0 };
function pathAt(x, z) {
  var s = pathSlope(z);
  _pa.d = Math.abs(wrapD(x - pathX(z))) / Math.sqrt(1 + s * s);   // ~distance to the path centreline
  _pa.w = P.width + P.widthVar * Math.sin(5 * K * z + 1.3);
  var f = 0.6 * Math.sin(2 * K * z + 0.7) + 0.4 * Math.sin(5 * K * z + 2.0);
  _pa.vis = 1 - P.fade * smoothstep(0.3, 0.75, f);               // 1 = obvious path, low = overgrown, easy to lose
  _pa.mask = 1 - smoothstep(_pa.w * 0.55, _pa.w, _pa.d);           // 1 on the path, 0 off it
  return _pa;
}

// Rolling hills: same idea, whole-number waves per tile. Path is worn down slightly.
var HILLS = [[1, 0, 1.1, 0.3], [0, 1, 0.9, 1.7], [1, 1, 0.6, 4.1], [2, -1, 0.35, 2.2], [3, 2, 0.18, 0.9], [-4, 5, 0.09, 5.0], [7, 3, 0.05, 1.3]];
function groundH(x, z) {
  var h = 0;
  for (var i = 0; i < HILLS.length; i++) { var w = HILLS[i]; h += w[2] * Math.sin(K * (w[0] * x + w[1] * z) + w[3]); }
  return h - 0.1 * pathAt(x, z).mask;
}
function groundNormal(x, z, out) {
  var e = 0.25;
  return out.set(groundH(x - e, z) - groundH(x + e, z), 2 * e, groundH(x, z - e) - groundH(x, z + e)).normalize();
}
// slow blotchy "how thick is the forest here" value, 0..1
function density(x, z) { return 0.5 + 0.25 * Math.sin(K * (2 * x + z) + 1.0) + 0.25 * Math.sin(K * (-x + 3 * z) + 2.5); }
function density2(x, z) { return 0.5 + 0.3 * Math.sin(K * (4 * x - 2 * z) + 0.2) + 0.2 * Math.sin(K * (3 * x + 5 * z) + 3.1); }

/* ============================================================
   RENDERER, SCENE, LIGHTS
   ============================================================ */
var canvas = document.getElementById('c');
var renderer = new T.WebGLRenderer({ canvas: canvas, antialias: CONFIG.look.antialias });
renderer.xr.enabled = true;            // no shadowMap at all: real-time shadows are too expensive on the Go
var ink = new T.Color(CONFIG.look.ink);
renderer.setClearColor(ink);

var scene = new T.Scene();
scene.background = ink;
// Flipped from STYLE LAB: fog goes to BLACK. The 1-bit shader turns black into ink,
// so the further away something is, the more it dissolves into pure ink.
scene.fog = new T.Fog('#000000', CONFIG.look.fogNear, CONFIG.look.fogFar);

var cam = new T.PerspectiveCamera(CONFIG.look.desktopFov, 1, 0.05, 60);
cam.rotation.order = 'YXZ';
var dolly = new T.Group(); dolly.add(cam); scene.add(dolly);

// moonlight: dim, from above. Mostly you'll only notice it on the pale path near your feet.
var M = CONFIG.moon;
var hemi = new T.HemisphereLight('#9aa4b8', '#000000', M.hemi); scene.add(hemi);
var moon = new T.DirectionalLight('#c8d4ff', M.intensity);
moon.position.set(M.dir[0], M.dir[1], M.dir[2]).multiplyScalar(30); scene.add(moon);

// the flashlight: a SpotLight glued to your head. decay 1 = fades in a straight line to 0 at `range`.
var FL = CONFIG.flashlight;
var flash = new T.SpotLight('#ffffff', FL.intensity, FL.range, FL.angle, FL.penumbra, 1);
flash.position.set(FL.offset[0], FL.offset[1], FL.offset[2]);
flash.target.position.set(0, -0.8, -6);   // aims where you look, tipped down a touch
cam.add(flash); cam.add(flash.target);

// ---------- sky dome (STYLE LAB shader, night colours: faint glow straight up, black everywhere else)
// One tweak: the gradient curve comes from CONFIG. The sky shader has no contrast curve (the mesh
// shader does), so with the old 0.6 curve you'd see sky dots through the trees right down to the horizon.
var skyMat = new T.ShaderMaterial({
  uniforms: { top: { value: new T.Color(CONFIG.look.skyTop) }, hor: { value: new T.Color('#000000') }, bot: { value: new T.Color('#000000') }, uMode: { value: 2 },
    uLevels: U.uLevels, uInk: U.uInk, uPaper: U.uPaper },
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 hor; uniform vec3 bot; uniform float uMode; uniform float uLevels; uniform vec3 uInk; uniform vec3 uPaper;\n' + BAYER +
    'varying vec3 vP;\nvoid main(){ float h = normalize(vP).y; vec3 c = h > 0.0 ? mix(hor, top, pow(h, ' + CONFIG.look.skyCurve.toFixed(2) + ')) : mix(hor, bot, pow(-h, 0.5));\n' +
    ' if (uMode > 1.5) { float l = dot(c, vec3(0.299,0.587,0.114)); c = mix(uInk, uPaper, step(bay8(gl_FragCoord.xy) + 0.001, l)); }\n' +
    ' else if (uMode > 0.5) { c = floor(c * uLevels + bay4(gl_FragCoord.xy)) / uLevels; }\n' +
    ' gl_FragColor = vec4(c, 1.0); }',
  side: T.BackSide, depthWrite: false
});
var sky = new T.Mesh(new T.SphereGeometry(50, 24, 12), skyMat);
// drawn LAST (not first like STYLE LAB): depth test then skips every pixel a tree already covers. Free fill-rate.
sky.frustumCulled = false; sky.renderOrder = 10; scene.add(sky);

// ---------- blob shadows (STYLE LAB shader, locked to the dithered/screen-door mode)
var blobMat = new T.ShaderMaterial({
  uniforms: { color: { value: new T.Color('#000000') }, opacity: { value: 0.55 }, uMode: { value: 2 }, uInk: U.uInk },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; vec4 p = vec4(position, 1.0);\n#ifdef USE_INSTANCING\n p = instanceMatrix * p;\n#endif\n gl_Position = projectionMatrix * modelViewMatrix * p; }',
  fragmentShader: 'uniform vec3 color; uniform float opacity; uniform float uMode; uniform vec3 uInk;\n' + BAYER +
    'varying vec2 vUv;\nvoid main(){ float r = length(vUv - 0.5) * 2.0; float a = (1.0 - smoothstep(0.3, 1.0, r)) * opacity;\n' +
    ' if (uMode > 0.5) { if (a < bay4(gl_FragCoord.xy) * 0.9 + 0.05) discard; gl_FragColor = vec4(uMode > 1.5 ? uInk : color, 1.0); }\n' +
    ' else gl_FragColor = vec4(color, a); }',
  transparent: false, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -8
});

/* ============================================================
   MATERIALS  (all 1-bit: Lambert lighting -> brightness -> dither to ink/paper)
   The grey value is just "how much light this bounces". Birch 0.87 glows in
   the torch, pine 0.4 stays murky, the path 0.78 is easier to see than leaf litter 0.4.
   ============================================================ */
function grey(g) { return new T.Color(g, g, g); }
var ONEBIT = { dither: 2, radialFog: true };
function lam(g, extra) {
  var p = { color: grey(g) }; if (extra) for (var k in extra) p[k] = extra[k];
  return new T.MeshLambertMaterial(p);
}
var matTrunk = patch(lam(1), ONEBIT);                         // per-tree grey comes from instanceColor
var matStub = patch(lam(0.5), ONEBIT);
var matCanopy = new T.MeshBasicMaterial({ color: ink, fog: false }); // pure silhouette, never lit
var matStump = patch(lam(0.56), ONEBIT);
var matRock = patch(lam(0.62, { flatShading: true }), ONEBIT);
var matBush = patch(lam(0.32), ONEBIT);
var matFern = patch(lam(0.58, { side: T.DoubleSide }), { dither: 2, radialFog: true, sway: F.fernSway });
var matLog = patch(lam(0.5), ONEBIT);
var matStick = patch(lam(0.62), ONEBIT);
var matGround = patch(new T.MeshLambertMaterial({ color: '#ffffff', vertexColors: true }), ONEBIT);

/* ============================================================
   GEOMETRY (built once, reused by every instance)
   ============================================================ */
function hash3(x, y, z) {
  x = Math.round(x * 1000) / 1000; y = Math.round(y * 1000) / 1000; z = Math.round(z * 1000) / 1000;
  var s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s);
}
// lumpy-ify a shape. Hashing the position means vertices in the same spot move the same way (no cracks).
function lumpy(g, amt) {
  var p = g.attributes.position;
  for (var i = 0; i < p.count; i++) {
    var x = p.getX(i), y = p.getY(i), z = p.getZ(i), s = 1 + amt * (hash3(x, y, z) - 0.5);
    p.setXYZ(i, x * s, y * s, z * s);
  }
  g.computeVertexNormals();
  return g;
}

// trunk: open-ended tapered cylinder, 1 unit tall, base at y=0. Each tree stretches it to its height.
var geoTrunk = new T.CylinderGeometry(0.1, 0.22, 1, 7, 1, true).translate(0, 0.5, 0);
var geoStub = new T.ConeGeometry(0.04, 1, 4, 1).translate(0, 0.5, 0);
var geoCanopy = new T.ConeGeometry(1, 1, 7, 1).translate(0, 0.5, 0);
var geoStump = (function () {
  var g = new T.CylinderGeometry(0.3, 0.36, 0.6, 8, 1).translate(0, 0.3, 0), p = g.attributes.position;
  for (var i = 0; i < p.count; i++) if (p.getY(i) > 0.59 && (Math.abs(p.getX(i)) > 0.01 || Math.abs(p.getZ(i)) > 0.01))

  if (player.stepDist >= Wk.stride) { player.stepDist -= Wk.stride; onFootstep(); }
  if (player.speed > 0.3) player.walkTime += dt;     // stage 4: the scare director feeds on this
  player.tileX = Math.floor(player.x / W); player.tileZ = Math.floor(player.z / W);  // which copy of the loop you're in
  var gy = groundH(player.x, player.z);
  player.y += (gy - player.y) * Math.min(1, dt * 8);
  dolly.position.set(player.x, player.y + (vr ? Wk.eyeHeight : 0), player.z);
  if (!vr) {
    var bob = Math.abs(Math.sin(player.stepDist / Wk.stride * Math.PI)) * 0.03 * Math.min(1, player.speed / Wk.speed);
    cam.position.set(0, Wk.eyeHeight + bob, 0);
    cam.rotation.set(player.pitch, player.yaw, 0);
  }
}

/* ============================================================
   FLASHLIGHT FLICKER
   flicker(strength) is public so the stage-4 scare director can call it.
   ============================================================ */
var flick = { next: 20, seq: null, i: 0, t: 0 };
function flicker(strength) {
  var seq = [], n = 2 + Math.floor(Math.random() * 2 + strength * 3);
  for (var i = 0; i < n; i++) { seq.push([mr(0.03, 0.09), 1 - strength * mr(0.4, 1)]); seq.push([mr(0.03, 0.15), 1]); }
  if (strength > 0.7) seq.push([mr(0.25, 0.6), 0.04], [0.06, 0.5], [0.05, 0.1], [0.1, 1]);  // the bad one: nearly dies
  flick.seq = seq; flick.i = 0; flick.t = 0;
}
function updateFlashlight(now, dt) {
  var level = 1;
  if (flick.seq) {
    flick.t += dt;
    while (flick.seq && flick.t > flick.seq[flick.i][0]) { flick.t -= flick.seq[flick.i][0]; flick.i++; if (flick.i >= flick.seq.length) flick.seq = null; }
    if (flick.seq) level = flick.seq[flick.i][1];
  } else if (started && now > flick.next) {
    flicker(mr(0.15, FL.flickerDepth));
    flick.next = now + mr(FL.flickerMinGap, FL.flickerMaxGap);
  }
  flash.intensity = FL.intensity * level;
}

/* ============================================================
   WORLD UPDATE: repack instances + re-centre the ground as you walk
   ============================================================ */
var packX = 1e9, packZ = 1e9;
function worldUpdate() {
  var dx = player.x - packX, dz = player.z - packZ, st = CONFIG.world.repackStep;
  if (dx * dx + dz * dz > st * st) {
    packX = player.x; packZ = player.z;
    for (var i = 0; i < sets.length; i++) packSet(sets[i], packX, packZ);
  }
  rebuildGround(player.x, player.z);
}

/* ============================================================
   DESKTOP: low-res render + nearest upscale (from STYLE LAB)
   ============================================================ */
var rtN = new T.WebGLRenderTarget(4, 4, { minFilter: T.NearestFilter, magFilter: T.NearestFilter });
var quadMat = new T.ShaderMaterial({
  uniforms: { tDiffuse: { value: null }, uVig: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: 'uniform sampler2D tDiffuse; uniform float uVig; varying vec2 vUv;\nvoid main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; float d = length(vUv - 0.5); c *= 1.0 - uVig * smoothstep(0.3, 0.8, d); gl_FragColor = vec4(c, 1.0); }',
  depthTest: false, depthWrite: false
});
var quadScene = new T.Scene(), quadCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
var quad = new T.Mesh(new T.PlaneGeometry(2, 2), quadMat); quad.frustumCulled = false; quadScene.add(quad);

function resize() {
  if (renderer.xr.isPresenting) return;
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  var ph = CONFIG.look.desktopPixelH, pw = Math.round(w * ph / h);
  rtN.setSize(pw, ph); U.uSnapRes.value.set(pw, ph);
  cam.aspect = w / h; cam.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ============================================================
   FPS COUNTER (DOM on desktop, a little floating label in VR)
   ============================================================ */
var showFps = CONFIG.debug.showFps, fpsEl = document.getElementById('fps');
var hudCanvas = document.createElement('canvas'); hudCanvas.width = 256; hudCanvas.height = 48;
var hudTex = new T.CanvasTexture(hudCanvas);
var hud = new T.Mesh(new T.PlaneGeometry(0.32, 0.06), new T.MeshBasicMaterial({ map: hudTex, transparent: true, depthTest: false, depthWrite: false, fog: false }));
hud.position.set(0, -0.3, -1); hud.renderOrder = 999; hud.frustumCulled = false; hud.visible = false; cam.add(hud);
function toggleFps() { showFps = !showFps; fpsEl.style.display = showFps && !renderer.xr.isPresenting ? 'block' : 'none'; }
function drawFps(txt) {
  fpsEl.textContent = txt;
  var x = hudCanvas.getContext('2d'); x.clearRect(0, 0, 256, 48);
  x.fillStyle = 'rgba(0,0,0,0.75)'; x.fillRect(0, 0, 256, 48);
  x.fillStyle = CONFIG.look.paper; x.font = '22px monospace'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(txt, 128, 25); hudTex.needsUpdate = true;
}

/* ============================================================
   INPUT + START SCREEN + VR
   ============================================================ */
var startEl = document.getElementById('start'), lockEl = document.getElementById('lock');
function begin() { started = true; startEl.style.display = 'none'; fpsEl.style.display = showFps ? 'block' : 'none'; }
document.getElementById('go').onclick = function () { begin(); if (canvas.requestPointerLock) canvas.requestPointerLock(); };
canvas.addEventListener('click', function () { if (started && !renderer.xr.isPresenting && canvas.requestPointerLock) canvas.requestPointerLock(); });
document.addEventListener('pointerlockchange', function () { lockEl.style.display = (started && document.pointerLockElement !== canvas && !renderer.xr.isPresenting) ? 'block' : 'none'; });
document.addEventListener('mousemove', function (e) {
  if (document.pointerLockElement !== canvas) return;
  player.yaw -= (e.movementX || 0) * Wk.mouseSens;
  player.pitch = clamp(player.pitch - (e.movementY || 0) * Wk.mouseSens, -1.45, 1.45);
});
window.addEventListener('keydown', function (e) { keys[e.code] = true; if (e.code === 'KeyF') toggleFps(); });
window.addEventListener('keyup', function (e) { keys[e.code] = false; });
window.addEventListener('blur', function () { keys = {}; });

var vrBtn = document.getElementById('vr'), session = null;
if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-vr').then(function (ok) { if (ok) vrBtn.style.display = 'inline-block'; });
}
vrBtn.onclick = function () {
  if (session) { session.end(); return; }
  navigator.xr.requestSession('immersive-vr').then(function (s) {
    session = s;
    if (document.exitPointerLock) document.exitPointerLock();
    renderer.xr.setReferenceSpaceType('local');
    var pr = renderer.xr.setSession(s);
    var fov = function () { if (renderer.xr.setFoveation) renderer.xr.setFoveation(CONFIG.look.vrFoveation); };
    if (pr && pr.then) pr.then(fov); else fov();
    dolly.rotation.set(0, player.yaw, 0);           // keep facing the way you were facing
    cam.position.set(0, 0, 0); cam.rotation.set(0, 0, 0);
    begin(); fpsEl.style.display = 'none';
    s.addEventListener('selectstart', function () { selectHeld = true; });
    s.addEventListener('selectend', function () { selectHeld = false; });
    s.addEventListener('end', function () {
      session = null; selectHeld = false; vrBtn.textContent = 'ENTER VR';
      dolly.rotation.set(0, 0, 0); started = false; startEl.style.display = ''; resize();
    });
    vrBtn.textContent = 'EXIT VR';
  });
};

/* ============================================================
   LOOP
   ============================================================ */
var lastT = 0, frames = 0, fpsT = 0, calls = 0, tris = 0;
function grabInfo() { calls = renderer.info.render.calls; tris = renderer.info.render.triangles; }
function loop(time) {
  var t = time / 1000, dt = clamp(t - lastT, 0, 0.05); lastT = t;
  var vr = renderer.xr.isPresenting;
  U.uTime.value = t;
  updateWalk(dt, t, vr);
  updateFlashlight(t, dt);
  worldUpdate();
  sky.position.copy(dolly.position);
  hud.visible = vr && showFps;
  frames++;
  if (time - fpsT > 1000) {
    var fps = Math.round(frames * 1000 / (time - fpsT)); frames = 0; fpsT = time;
    drawFps(fps + ' fps  ' + calls + ' calls  ' + Math.round(tris / 1000) + 'k tris');
  }
  if (vr) { renderer.render(scene, cam); grabInfo(); return; }
  renderer.setRenderTarget(rtN); renderer.render(scene, cam); grabInfo(); renderer.setRenderTarget(null);
  quadMat.uniforms.tDiffuse.value = rtN.texture;
  renderer.render(quadScene, quadCam);
}

// expose a few things for testing in the console (and for later stages)
window.TREELINE = { CONFIG: CONFIG, player: player, flicker: flicker, scene: scene, sets: sets };

resize();
worldUpdate();
renderer.setAnimationLoop(loop);
})();
</script>
</body>
</html>
